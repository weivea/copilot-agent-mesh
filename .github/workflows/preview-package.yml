name: Preview package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests-and-package:
    name: ${{ matrix.os }} offline tests and package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:component

      - name: Extension Host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension

      - name: Extension Host tests
        if: runner.os != 'Linux'
        run: npm run test:extension

      - run: npm run package:vsix

      - name: Installed VSIX activation smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:vsix

      - name: Installed VSIX activation smoke
        if: runner.os != 'Linux'
        run: npm run smoke:vsix

      - uses: actions/upload-artifact@v4
        with:
          name: copilot-agent-mesh-preview-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 14
